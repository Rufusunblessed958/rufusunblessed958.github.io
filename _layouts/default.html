<!doctype html>
<html lang="{% if page.lang == 'en' %}en{% else %}zh-CN{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/language.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/refinement.css' | relative_url }}">
  {% seo %}
  {% feed_meta %}
  <script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <header class="masthead"><div class="wrap headrow"><a class="brand" href="{{ '/' | relative_url }}">EVENBAO</a><nav>{% if page.lang == 'en' %}<a href="{{ '/en/' | relative_url }}">Posts</a><a href="{{ '/en/about/' | relative_url }}">About</a><a href="{{ '/admin/' | relative_url }}">Editor</a><a href="https://www.cnblogs.com/evenbao" target="_blank" rel="noopener">CNBlogs ↗</a><a class="language" href="{{ page.translation_url | default: '/' | relative_url }}" lang="zh-CN">中文</a>{% else %}<a href="{{ '/' | relative_url }}">文章</a><a href="{{ '/about/' | relative_url }}">关于</a><a href="{{ '/admin/' | relative_url }}">管理</a><a href="https://www.cnblogs.com/evenbao" target="_blank" rel="noopener">博客园 ↗</a><a class="language" href="{{ page.translation_url | default: '/en/' | relative_url }}" lang="en">English</a>{% endif %}</nav></div></header>
  <main class="wrap">{{ content }}</main>
  <footer class="wrap footer">© {{ 'now' | date: '%Y' }} EVENBAO · <a href="{{ '/feed.xml' | relative_url }}">RSS</a> · {% if page.lang == 'en' %}Original publication links are preserved{% else %}保留历史文章的原文链接{% endif %}</footer>
</body>
</html>
